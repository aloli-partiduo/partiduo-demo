# Force les sources locales des shards que d'autres dépendances déclarent
# en github: (marten_auth -> marten, authn -> password-policy, webauthn -> jose,
# pdf-a et pdf-validate -> pdf), comme dans partiduo-app (DECISIONS D-003),
# et celles des extensions qui en dépendent entre elles (einvoicing ->
# document, superpdp et esalink -> einvoicing).
dependencies:
  partiduo:
    path: ../partiduo-app
  partiduo-ui-bulma:
    path: ../partiduo-ui-bulma
  partiduo-document:
    path: ../partiduo-document
  partiduo-einvoicing:
    path: ../partiduo-einvoicing
  marten:
    path: ../../prod-crystal/marten
  password-policy:
    path: ../../prod-crystal/password-policy
  jose:
    path: ../../prod-crystal/jose
  pdf:
    path: ../../prod-crystal/pdf
