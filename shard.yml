name: partiduo-demo
version: 0.1.5

description: |
  Dossiers de démonstration de Partiduo (entreprise, profession libérale,
  micro-entrepreneur, foyer) décrits par des fichiers de données
  déclaratifs, leur format, un validateur léger qui ne dépend ni de
  Partiduo ni de Marten, et scripts/demo, qui les charge, les vérifie et
  les sert en local avec le binaire de la distribution (partiduo-dist).

authors:
  - Philippe Nénert <it+claude.ai@aloli.fr>

crystal: ">= 1.19.1"

license: AGPL-3.0-or-later

targets:
  # Validateur des dossiers (schéma, références, équilibres, totaux attendus,
  # aucun secret) : bibliothèque standard de Crystal seulement.
  partiduo-demo-valider:
    main: src/valider.cr

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
