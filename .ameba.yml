# Configuration d'Ameba pour partiduo-demo (validateur des dossiers).
Globs:
  - "**/*.cr"
  - "!lib"

Excluded:
  - lib/
  - tmp/

# Le validateur aiguille chaque champ du schéma et chaque type d'opération
# ou de contrôle : la complexité mesurée y reflète la liste des types du
# format, pas une logique.
Metrics/CyclomaticComplexity:
  MaxComplexity: 20
