# SPDX-License-Identifier: AGPL-3.0-or-later
#
# CI de partiduo-demo : légère, quelques minutes. Les dossiers de
# démonstration sont des fichiers de données ; la CI les valide sans
# compiler ni Partiduo ni Marten (validateur : bibliothèque standard de
# Crystal), puis contrôle format, Ameba, garde-fou de mention et syntaxe
# des scripts. Le chargement réel se vérifie sur le poste (scripts/demo,
# `partiduo-manage demo verifier`) et à la construction des paquets FreeBSD
# de partiduo-dist.
name: CI

on:
  push:
    branches: [development, production]
  pull_request:
  # Lancement manuel (onglet Actions ou `gh workflow run ci.yml`).
  workflow_dispatch:

jobs:
  dossiers:
    name: Dossiers, format, Ameba
    runs-on: ubuntu-latest
    container: crystallang/crystal:1.19.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verrou sans dépendance « path »
        run: "! grep -q 'path:' shard.lock"
      - name: Aucune mention du logiciel d'origine hors documentation
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git grep -il 'noa[l]yss' -- . ':!*.adoc' ':!*.md'; then
            echo "Mention du logiciel d'origine hors *.adoc/*.md" >&2
            exit 1
          fi
      - name: Scripts (syntaxe POSIX)
        run: sh -n scripts/demo
      - name: Format
        run: crystal tool format --check src spec
      - name: Validateur
        run: shards build partiduo-demo-valider --without-development
      - name: Dossiers (schéma, références, équilibres, totaux attendus, secrets)
        run: bin/partiduo-demo-valider --detail dossiers
      - name: Specs du validateur
        run: crystal spec
      - name: Ameba
        run: shards install && crystal build lib/ameba/bin/ameba.cr -o bin/ameba && bin/ameba
